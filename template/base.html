<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #222; }
        nav { background: #1f2937; padding: 14px 30px; display: flex; gap: 20px; align-items: center; }
        nav a { color: #fff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        nav .right { margin-left: auto; display: flex; gap: 20px; align-items: center; }
        nav button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1em; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        section { margin-bottom: 40px; }
        h2 { border-bottom: 2px solid #1f2937; padding-bottom: 6px; margin-bottom: 16px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
        .bar { background: #e5e7eb; border-radius: 6px; height: 12px; }
        .bar div { background: #2563eb; height: 12px; border-radius: 6px; }
        img.photo { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'cv' %}">CV</a>
        <a href="{% url 'contact' %}">Contact</a>
        <div class="right">
            {% if user.is_authenticated %}
                {% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a>{% endif %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'registration' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
