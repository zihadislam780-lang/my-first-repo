{% extends 'base.html' %}
{% block title %}Contact{% endblock %}

{% block content %}
<h2>Contact Me</h2>

{% if messages %}
    {% for m in messages %}
        <p style="color:green;">{{ m }}</p>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send</button>
</form>
{% endblock %}
